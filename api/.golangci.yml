version: "2"

linters:
  default: standard        # errcheck / govet / ineffassign / staticcheck / unused
  enable:
    - errorlint
    - gosec
    - revive
  exclusions:
    presets:
      - comments               # 公開する関数のコメントの書式（"Name ..." で始める）を強制しない
      - common-false-positives
      - std-error-handling     # defer x.Close() などの戻り値を無視するのを許す
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/geek-teru/go-react-ec
