# air（ホットリロード）の設定。make api-dev（cd api && go tool air）で使う
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "db/migrations"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  # WSL から /mnt/c を見ると Windows 側の編集が inotify で届かないため、ポーリングで検知する
  poll = true
  poll_interval = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = true

[misc]
  clean_on_exit = true
