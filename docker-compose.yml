services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: local
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local -d local"]
      interval: 5s
      timeout: 3s
      retries: 10

  stripe-mock:
    image: stripe/stripe-mock:latest
    ports:
      - "12111:12111"   # HTTP
      - "12112:12112"   # HTTPS

volumes:
  db-data: